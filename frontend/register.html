<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ServeU</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <a href="index.html" class="logo">ServeU</a>

            <h1>Create your account</h1>
            <p>Join ServeU and get started.</p>

            <form id="registerForm">

                <label for="accountType">Register as</label>
                <select id="accountType" required>
                    <option value="">Select account type</option>
                    <option value="CUSTOMER">Customer</option>
                    <option value="WORKER">Worker</option>
                </select>

                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Phone number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <!-- Worker-only fields -->
                <div id="workerFields" hidden>

                    <label for="serviceCategory">Service category</label>
                    <select id="serviceCategory">
                        <option value="">Loading service categories...</option>
                    </select>

                    <label for="experienceYears">Experience (years)</label>
                    <input type="number" id="experienceYears" min="0" placeholder="Example: 3">

                    <label for="description">Service description</label>
                    <textarea id="description" placeholder="Describe your services"></textarea>

                </div>

                <button type="submit">Create Account</button>

                <p id="registerMessage"></p>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </main>
    <script src="script.js"></script>
</body>

</html>
